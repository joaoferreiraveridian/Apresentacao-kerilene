<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IA no Dia a Dia — Kerilene</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@400;500;600;700&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body { font-family: 'Inter', sans-serif; background: #0a0a14; color: #fff; min-height: 100vh; }

  /* ── NAV MÓDULOS ── */
  .mod-nav {
    display: flex; flex-wrap: wrap; gap: 6px;
    padding: 12px 20px;
    background: rgba(255,255,255,0.03);
    border-bottom: 1px solid rgba(255,255,255,0.06);
    position: sticky; top: 0; z-index: 100;
    backdrop-filter: blur(8px);
  }
  .mod-btn {
    font-size: 11px; font-weight: 600;
    padding: 5px 12px; border-radius: 20px;
    border: 1px solid rgba(255,255,255,0.08);
    background: transparent; color: rgba(255,255,255,0.35);
    cursor: pointer; transition: all 0.2s; white-space: nowrap;
  }
  .mod-btn:hover { color: rgba(255,255,255,0.65); border-color: rgba(255,255,255,0.18); }
  .mod-btn.active { background: rgba(186,117,23,0.18); border-color: rgba(186,117,23,0.45); color: #EF9F27; }

  /* ── SLIDE BASE ── */
  .slide {
    min-height: calc(100vh - 50px);
    display: flex; flex-direction: column;
    justify-content: center;
    padding: 48px 24px;
    position: relative; overflow: hidden;
  }
  .slide-num {
    position: absolute; bottom: 20px; right: 28px;
    font-size: 11px; color: rgba(255,255,255,0.18); letter-spacing: 1px;
  }

  /* ── TIPOGRAFIA ── */
  .serif { font-family: 'Playfair Display', serif; }
  .eyebrow {
    font-size: 10px; font-weight: 700; letter-spacing: 3px;
    text-transform: uppercase; margin-bottom: 10px;
    color: #EF9F27;
  }
  h1.big {
    font-family: 'Playfair Display', serif;
    font-size: clamp(30px, 7vw, 52px);
    font-weight: 700; line-height: 1.12; color: #fff;
  }
  h2.section {
    font-family: 'Playfair Display', serif;
    font-size: clamp(22px, 5vw, 38px);
    font-weight: 700; line-height: 1.2; color: #1a1a0e;
    text-align: center; margin-bottom: 6px;
  }
  h2.section.light { color: #fff; }
  .subtitle {
    font-size: clamp(14px, 3.5vw, 17px);
    color: rgba(255,255,255,0.55); line-height: 1.6;
  }
  .accent-gold { color: #EF9F27; }
  .accent-green { color: #7aad8c; }
  .accent-coral { color: #c87b5e; }

  /* ── LAYOUTS ── */
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; align-items: start; }
  .grid3 { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 16px; }
  .flex-center { display: flex; align-items: center; justify-content: center; gap: 20px; flex-wrap: wrap; }

  /* ── CARDS ── */
  .card-warm {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 14px; padding: 22px;
  }
  .card-light {
    background: rgba(255,255,255,0.92);
    border-radius: 14px; padding: 22px;
    color: #2a1f14;
  }

  /* ── DIVIDER ── */
  .line-gold { width: 48px; height: 3px; background: #BA7517; margin-bottom: 20px; border-radius: 2px; }
  .line-center { margin: 0 auto 20px; }

  /* ── SLIDE 1: CAPA ── */
  #s1 {
    background: linear-gradient(135deg, #0e0a04 0%, #1a1006 40%, #0a0a14 100%);
    min-height: 100vh;
  }
  #s1::before {
    content: '';
    position: absolute; top: -80px; right: -60px;
    width: 400px; height: 400px;
    background: radial-gradient(circle, rgba(186,117,23,0.22) 0%, transparent 65%);
    pointer-events: none;
  }
  #s1::after {
    content: '';
    position: absolute; bottom: -60px; left: -40px;
    width: 300px; height: 300px;
    background: radial-gradient(circle, rgba(120,90,60,0.15) 0%, transparent 65%);
    pointer-events: none;
  }
  .capa-inner { position: relative; z-index: 1; max-width: 720px; }
  .capa-tag {
    display: inline-block;
    font-size: 10px; font-weight: 700; letter-spacing: 2.5px;
    text-transform: uppercase; color: #EF9F27;
    border: 1px solid rgba(186,117,23,0.4);
    border-radius: 20px; padding: 5px 14px; margin-bottom: 24px;
  }
  .capa-title {
    font-family: 'Playfair Display', serif;
    font-size: clamp(34px, 8vw, 62px);
    font-weight: 700; line-height: 1.1; color: #fff; margin-bottom: 16px;
  }
  .capa-title .gold { color: #EF9F27; }
  .capa-sub {
    font-size: clamp(14px, 3.5vw, 18px);
    color: rgba(255,255,255,0.5); line-height: 1.65;
    max-width: 480px; margin-bottom: 36px;
  }
  .capa-pills { display: flex; flex-wrap: wrap; gap: 10px; }
  .pill-warm {
    background: rgba(186,117,23,0.12);
    border: 1px solid rgba(186,117,23,0.3);
    border-radius: 20px; padding: 7px 16px;
    font-size: 13px; color: #EF9F27;
  }

  /* ── SLIDE 2: QUEM SOU EU ── */
  #s2 { background: linear-gradient(135deg, #0e0a04 0%, #1a1006 60%, #0e0c08 100%); }
  #s2::before {
    content: '';
    position: absolute; top: -100px; right: -80px;
    width: 450px; height: 450px;
    background: radial-gradient(circle, rgba(186,117,23,0.18) 0%, transparent 65%);
    pointer-events: none;
  }
  .profile-icon {
    width: clamp(80px, 18vw, 140px);
    height: clamp(80px, 18vw, 140px);
    border-radius: 50%;
    background: linear-gradient(135deg, rgba(186,117,23,0.3), rgba(120,90,60,0.2));
    border: 2px solid rgba(186,117,23,0.4);
    display: flex; align-items: center; justify-content: center;
    font-size: clamp(32px, 8vw, 56px); flex-shrink: 0;
  }
  .name-big {
    font-family: 'Playfair Display', serif;
    font-size: clamp(36px, 9vw, 64px);
    font-weight: 700; color: #fff; line-height: 1;
    margin-bottom: 28px;
  }
  .tag-list { display: flex; flex-direction: column; gap: 12px; }
  .tag-item {
    display: inline-flex; align-items: center;
    padding: 10px 20px; border-radius: 30px;
    font-size: clamp(13px, 3.2vw, 15px); font-weight: 500;
    align-self: flex-start;
  }
  .tag-coral { background: rgba(200,123,94,0.25); border: 1px solid rgba(200,123,94,0.4); color: #e8a98a; }
  .tag-green { background: rgba(122,173,140,0.2); border: 1px solid rgba(122,173,140,0.35); color: #9dd4b2; }
  .tag-amber { background: rgba(186,117,23,0.2); border: 1px solid rgba(186,117,23,0.35); color: #EF9F27; }

  /* ── SLIDE 3: PASSADO x PRESENTE ── */
  #s3 { background: linear-gradient(160deg, #0e0a04 0%, #12100a 100%); }
  .vs-card {
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 14px; padding: 24px; flex: 1;
  }
  .vs-title {
    font-family: 'Playfair Display', serif;
    font-size: clamp(18px, 4vw, 24px); font-weight: 700;
    text-align: center; margin-bottom: 16px;
  }
  .vs-title.past { color: #c87b5e; }
  .vs-title.present { color: #7aad8c; }
  .vs-item {
    font-size: clamp(12px, 3vw, 14px);
    color: rgba(255,255,255,0.55); line-height: 1.6;
    padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,0.05);
    text-align: center;
  }
  .vs-item:last-child { border-bottom: none; }
  .vs-connector {
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; padding: 0 8px;
  }
  .vs-quote {
    background: rgba(186,117,23,0.15);
    border: 1px solid rgba(186,117,23,0.3);
    border-radius: 12px; padding: 16px 14px;
    font-family: 'Playfair Display', serif;
    font-size: clamp(13px, 3vw, 15px);
    font-style: italic; color: #EF9F27;
    text-align: center; font-weight: 600;
    max-width: 160px; line-height: 1.5;
  }

  /* ── SLIDE 4: VERSÍCULO ── */
  #s4 {
    background: radial-gradient(ellipse at center, #2a1a04 0%, #150e02 40%, #080604 100%);
    text-align: center;
  }
  #s4::before {
    content: '';
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    width: 500px; height: 500px;
    background: radial-gradient(circle, rgba(186,117,23,0.3) 0%, transparent 60%);
    pointer-events: none;
  }
  .versiculo-text {
    font-family: 'Playfair Display', serif;
    font-size: clamp(24px, 6vw, 48px);
    font-weight: 500; line-height: 1.3;
    color: #f5deb3; position: relative; z-index: 1;
    margin-bottom: 20px; max-width: 700px;
  }
  .versiculo-ref {
    font-family: 'Playfair Display', serif;
    font-size: clamp(18px, 4vw, 28px);
    font-weight: 700; color: #EF9F27;
    position: relative; z-index: 1; margin-bottom: 24px;
  }
  .versiculo-sub {
    font-size: clamp(12px, 3vw, 15px);
    color: rgba(255,220,150,0.5);
    position: relative; z-index: 1; max-width: 440px; margin: 0 auto;
    line-height: 1.65;
  }

  /* ── SLIDE 5: MOTOR DA IA ── */
  #s5 { background: linear-gradient(135deg, #0e0a04 0%, #12100a 100%); }
  .motor-center {
    background: linear-gradient(135deg, rgba(186,117,23,0.25), rgba(120,80,40,0.2));
    border: 1px solid rgba(186,117,23,0.4);
    border-radius: 14px; padding: 22px 18px;
    text-align: center; max-width: 220px;
  }
  .motor-title {
    font-size: clamp(13px, 3vw, 15px); font-weight: 700;
    color: #EF9F27; margin-bottom: 8px;
  }
  .motor-desc {
    font-size: clamp(11px, 2.5vw, 13px);
    color: rgba(255,255,255,0.55); line-height: 1.55;
  }
  .motor-output {
    display: flex; flex-direction: column; gap: 10px; flex: 1;
  }
  .out-item {
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 30px; padding: 10px 18px;
    font-size: clamp(12px, 3vw, 14px); font-weight: 500;
    color: rgba(255,255,255,0.75);
    display: flex; align-items: center; gap: 10px;
  }
  .out-dot {
    width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
  }
  .od-folder { background: #BA7517; }
  .od-chat   { background: #7aad8c; }
  .od-compass{ background: #c87b5e; }
  .od-magic  { background: #7F77DD; }
  .arrow-right {
    font-size: 20px; color: rgba(186,117,23,0.5);
    flex-shrink: 0; align-self: center;
  }

  /* ── SLIDE 6: EVOLUÇÃO EM NÚMEROS ── */
  #s6 { background: linear-gradient(135deg, #0e0a04 0%, #12100a 100%); }
  .metric-card {
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 14px; padding: 24px 16px;
    text-align: center;
  }
  .metric-num {
    font-family: 'Playfair Display', serif;
    font-size: clamp(36px, 9vw, 60px);
    font-weight: 700; line-height: 1; margin-bottom: 8px;
  }
  .mn-green { color: #7aad8c; }
  .mn-amber { color: #EF9F27; }
  .mn-neutral { color: rgba(255,255,255,0.7); }
  .metric-desc {
    font-size: clamp(11px, 2.8vw, 13px);
    color: rgba(255,255,255,0.45); line-height: 1.55;
  }
  .modalities {
    display: flex; justify-content: center;
    gap: clamp(12px, 4vw, 28px); flex-wrap: wrap;
    margin-top: 28px;
  }
  .mod-item { text-align: center; }
  .mod-icon {
    width: clamp(44px, 10vw, 64px); height: clamp(44px, 10vw, 64px);
    border-radius: 50%;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.12);
    display: flex; align-items: center; justify-content: center;
    font-size: clamp(18px, 4.5vw, 26px); margin: 0 auto 8px;
  }
  .mod-label {
    font-size: clamp(10px, 2.5vw, 12px);
    color: rgba(255,255,255,0.45);
  }

  /* ── SLIDE 7: IA INVISÍVEL ── */
  #s7 { background: linear-gradient(135deg, #0e0a04 0%, #12100a 100%); }
  .flow-cards {
    display: flex; flex-direction: column; gap: 14px; margin-top: 24px;
  }
  .flow-card {
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 14px; padding: 18px 20px;
    display: flex; gap: 14px; align-items: flex-start;
  }
  .flow-icon {
    width: 40px; height: 40px; border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px; flex-shrink: 0;
  }
  .fi-coral  { background: rgba(200,123,94,0.2); border: 1px solid rgba(200,123,94,0.3); }
  .fi-amber  { background: rgba(186,117,23,0.2); border: 1px solid rgba(186,117,23,0.3); }
  .fi-green  { background: rgba(122,173,140,0.2); border: 1px solid rgba(122,173,140,0.3); }
  .flow-title {
    font-size: clamp(14px, 3.5vw, 16px); font-weight: 700;
    color: #fff; margin-bottom: 5px;
  }
  .flow-desc {
    font-size: clamp(12px, 3vw, 13px);
    color: rgba(255,255,255,0.45); line-height: 1.6;
  }
  .flow-desc strong { color: rgba(255,255,255,0.75); font-weight: 600; }
  .flow-contexts {
    display: flex; gap: 8px; flex-wrap: wrap; margin-top: 20px;
  }
  .ctx-tag {
    font-size: 12px; font-weight: 600;
    padding: 5px 14px; border-radius: 20px;
    background: rgba(186,117,23,0.12);
    border: 1px solid rgba(186,117,23,0.25);
    color: rgba(239,159,39,0.8);
  }

  /* ── SLIDE 8: FATOR HUMANO ── */
  #s8 { background: linear-gradient(135deg, #0e0a04 0%, #12100a 100%); }
  .balance-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 24px; }
  .bal-card {
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 14px; padding: 22px 18px;
  }
  .bal-title {
    font-size: clamp(13px, 3.2vw, 15px); font-weight: 700;
    margin-bottom: 14px; display: flex; align-items: center; gap: 8px;
  }
  .bt-machine { color: #c87b5e; }
  .bt-human   { color: #7aad8c; }
  .bal-item {
    display: flex; gap: 8px; align-items: flex-start;
    font-size: clamp(12px, 3vw, 13px);
    color: rgba(255,255,255,0.55); line-height: 1.5;
    padding: 6px 0; border-bottom: 1px solid rgba(255,255,255,0.04);
  }
  .bal-item:last-child { border-bottom: none; }
  .bi-dot { color: #EF9F27; font-size: 16px; flex-shrink: 0; margin-top: -1px; }
  .golden-rule {
    background: linear-gradient(135deg, rgba(30,18,4,0.9), rgba(25,15,3,0.95));
    border: 1px solid rgba(186,117,23,0.35);
    border-radius: 12px; padding: 16px 20px;
    text-align: center; margin-top: 16px;
  }
  .gr-text {
    font-family: 'Playfair Display', serif;
    font-size: clamp(14px, 3.5vw, 18px);
    font-weight: 700; color: #EF9F27;
  }

  /* ── SLIDE 9: MITO OU VERDADE ── */
  #s9 { background: linear-gradient(135deg, #0e0a04 0%, #12100a 100%); }
  .myth-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 24px; align-items: start; }
  .myth-card {
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.09);
    border-radius: 14px; padding: 22px 18px; text-align: center;
  }
  .myth-card.mito  { border-top: 3px solid rgba(200,100,100,0.6); }
  .myth-card.truth { border-top: 3px solid rgba(122,173,140,0.6); }
  .myth-label {
    font-size: 11px; font-weight: 700; letter-spacing: 2px;
    text-transform: uppercase; margin-bottom: 12px;
  }
  .ml-mito  { color: rgba(220,120,120,0.8); }
  .ml-truth { color: #7aad8c; }
  .myth-icon { font-size: 36px; margin-bottom: 12px; }
  .myth-title {
    font-family: 'Playfair Display', serif;
    font-size: clamp(16px, 4vw, 20px); font-weight: 700;
    color: #fff; margin-bottom: 12px;
  }
  .myth-text {
    font-size: clamp(12px, 3vw, 13px);
    color: rgba(255,255,255,0.5); line-height: 1.65;
  }
  .arrow-middle {
    display: flex; align-items: center; justify-content: center;
    font-size: 28px; color: rgba(186,117,23,0.5);
    position: absolute; left: 50%; top: 55%; transform: translate(-50%,-50%);
  }

  /* ── SLIDE 10: LIMITES ── */
  #s10 { background: linear-gradient(135deg, #0e0a04 0%, #12100a 100%); }
  .limits-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 24px; }
  .limit-card {
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.09);
    border-radius: 14px; padding: 20px 18px;
  }
  .limit-header {
    font-size: clamp(13px, 3.2vw, 15px); font-weight: 700;
    padding: 8px 14px; border-radius: 8px; text-align: center;
    margin-bottom: 16px;
  }
  .lh-green { background: rgba(122,173,140,0.2); color: #7aad8c; }
  .lh-coral { background: rgba(200,100,100,0.2); color: rgba(220,130,130,0.9); }
  .limit-item {
    display: flex; gap: 10px; align-items: flex-start;
    font-size: clamp(12px, 3vw, 13px);
    color: rgba(255,255,255,0.5); line-height: 1.55;
    padding: 7px 0; border-bottom: 1px solid rgba(255,255,255,0.05);
  }
  .limit-item:last-child { border-bottom: none; }
  .li-check { color: #7aad8c; flex-shrink: 0; }
  .li-cross { color: rgba(220,120,120,0.8); flex-shrink: 0; }
  .limit-footer {
    background: rgba(20,12,4,0.95);
    border: 1px solid rgba(186,117,23,0.25);
    border-radius: 10px; padding: 14px 18px;
    text-align: center; margin-top: 14px;
  }
  .lf-text {
    font-size: clamp(12px, 3vw, 14px);
    color: rgba(255,255,255,0.6); line-height: 1.6;
  }
  .lf-text strong { color: #EF9F27; }

  /* ── SLIDE 11: ARTE DA PERGUNTA ── */
  #s11 { background: linear-gradient(135deg, #0e0a04 0%, #12100a 100%); }
  .phone-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 24px; align-items: start; }
  .phone-mock {
    border: 2px solid rgba(255,255,255,0.15);
    border-radius: 24px; padding: 20px 16px;
    background: rgba(255,255,255,0.04);
  }
  .phone-mock.highlighted {
    border-color: rgba(186,117,23,0.5);
    background: rgba(186,117,23,0.06);
  }
  .phone-label {
    font-size: 11px; font-weight: 700; letter-spacing: 1.5px;
    text-transform: uppercase; text-align: center; margin-bottom: 14px;
  }
  .pl-simple { color: rgba(255,255,255,0.35); }
  .pl-detail { color: #EF9F27; }
  .chat-msg {
    border-radius: 10px; padding: 10px 13px;
    margin-bottom: 8px; font-size: clamp(11px, 2.8vw, 13px); line-height: 1.55;
  }
  .msg-user {
    background: rgba(186,117,23,0.15);
    border: 1px solid rgba(186,117,23,0.25);
    color: rgba(255,220,150,0.85);
  }
  .msg-ai {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.1);
    color: rgba(255,255,255,0.55);
  }
  .msg-label {
    font-size: 10px; font-weight: 700; margin-bottom: 4px;
    text-transform: uppercase; letter-spacing: 1px;
  }
  .ml-user { color: rgba(186,117,23,0.8); }
  .ml-ai   { color: rgba(122,173,140,0.8); }
  .phone-center {
    display: flex; align-items: center; justify-content: center;
  }
  .insight-box {
    background: rgba(186,117,23,0.12);
    border: 1px solid rgba(186,117,23,0.3);
    border-radius: 12px; padding: 14px 12px;
    text-align: center;
    font-size: clamp(12px, 3vw, 14px);
    font-weight: 700; color: #EF9F27; line-height: 1.45;
    max-width: 140px;
  }

  /* ── SLIDE 12: FRAMEWORK ── */
  #s12 { background: linear-gradient(135deg, #0e0a04 0%, #12100a 100%); }
  .formula-row {
    display: flex; align-items: center; gap: 10px;
    flex-wrap: wrap; margin: 20px 0 28px;
  }
  .f-block {
    padding: 10px 18px; border-radius: 30px;
    font-size: clamp(12px, 3vw, 14px); font-weight: 700;
    white-space: nowrap;
  }
